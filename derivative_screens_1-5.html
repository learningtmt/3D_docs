        '<p class="t2" id="s4-deflead" style="margin-bottom:0">' + T.s4_def_lead + '</p>' +
        '<div class="defbox" id="s4-def">' + fill(T.s4_def, { lim: limHTML }) + '</div>' +
        '<p class="note" id="s4-defnote" style="font-size:14px">' + T.s4_def_note + '</p>' +
        '<div class="conclusion" id="s4-name">' + T.s4_name + '</div>' +
        '<div id="s4-b2"><p class="t2">' + T.s4_t2 + '</p><p class="readhint" id="s4-read2">' + T.s4_read + '</p>' +
          '<div class="row"><button type="button" class="btn primary pulsebtn" id="s4-go2" style="flex:none">' + T.s4_go + '</button></div></div>' +
      '</div>' +
      '<div id="s4-fig2" hidden style="margin-top:6px">' + ctlRow(2) +
        '<div class="frame"><svg id="s4-svg2" class="cv" role="img" aria-label="Đường nối A–B quay dần khi B tiến sát A, cho đến khi gần như chỉ còn một điểm."></svg></div>' +
      '</div>' +
      '<div id="s4-after2" hidden>' +
        '<div class="conclusion" id="s4-conc2" style="scroll-margin-top:124px">' + T.s4_t_concl + '</div>' +
        '<div class="conclusion" id="s4-hsg">' + T.s4_t_hsg + '</div>' +
        '<p class="bridge">' + T.s4_bridge + '</p>' +
      '</div>';
    svg1 = $('#s4-svg1'); svg2 = $('#s4-svg2');
    clock1 = makeClock(paint1, () => finishRun(1));
    clock2 = makeClock(paint2, () => finishRun(2));
    $('#s4-fgo').addEventListener('click', () => { st.f = true; log('s4_formula'); renderFormula(); try { $('#s4-fcard').scrollIntoView({ block: 'center', behavior: reduced() ? 'auto' : 'smooth' }); } catch (e) {} });
    bindControls(1); bindControls(2);
    renderFormula();
    if (st.ran1){
      $('#s4-fig1').hidden = false; $('#s4-go1').hidden = true; $('#s4-read1').hidden = true;
      clock1.setTotal(R1.total); clock1.seek(R1.total);
      renderAfter1();
    }
    if (st.ran2){
      $('#s4-fig2').hidden = false; $('#s4-go2').hidden = true; $('#s4-read2').hidden = true;
      clock2.setTotal(R2.total); clock2.seek(R2.total);
      renderAfter2();
    }
    syncButtons(1); syncButtons(2);
  }
  return {
    tab: T.tab4, hasNext: true,
    mount: mount,
    unmount(){ if (clock1) clock1.stop(); if (clock2) clock2.stop(); svg1 = null; svg2 = null; },
    redraw(){
      if (svg1 && clock1 && !$('#s4-fig1').hidden) paint1(clock1.t);
      if (svg2 && clock2 && !$('#s4-fig2').hidden) paint2(clock2.t);
    },
    dbg: { seek1: t => { clock1.pause(); clock1.seek(t); syncButtons(1); }, seek2: t => { clock2.pause(); clock2.seek(t); syncButtons(2); },
           R1: R1, R2: R2, get clock1(){ return clock1; }, get clock2(){ return clock2; } }
  };
}
/* ============================================================
   MÀN 5 — Tự tay tính với y = x²
   Chữ đứng yên → "Tính thử" (bảng h = 1; 0,1; 0,01) → "Rút gọn" (đại số, rút h, h → 0) → "Thay 3 bằng x₀ bất kỳ" (2x₀)
   → chữ + nút "Xem minh họa": ba tiếp tuyến lần lượt hiện (không chữ nào chạy) → chạy xong mới hiện hệ số góc −4, 0, 4.
   ============================================================ */
function createS5(){
  const st = state.s5;                                   // { stage, ranB }
  /* ⏱ THỜI GIAN MÀN 5: mỗi tiếp tuyến có thời điểm bắt đầu vẽ (s) và vẽ xong (e), tính bằng ms.
     TOTAL = lúc kết thúc; TOTAL − e của tiếp tuyến cuối = thời gian hình đứng yên trước khi hiện nhãn −4, 0, 4 và câu kết luận
     (để ngắn, 700, để học sinh không tưởng bị đơ). */
  const TANG = [{ x0: -2, s: 600, e: 2200 }, { x0: 0, s: 2800, e: 4400 }, { x0: 2, s: 5000, e: 6600 }];
  const TOTAL = 7300;
  const BOUNDS = TANG.map(q => q.e).concat([TOTAL]);
  let root, svg, clock = null;
  const $ = s => root.querySelector(s);
  const HS = [1, 0.1, 0.01];

  /* 🎨 VẼ: parabol + ba tiếp tuyến (tỉ lệ 1:1) là hàm của thời gian t. Nhãn hệ số góc chỉ vẽ khi t ≥ TOTAL. */
  function paint(t){
    if (!svg) return;
    const W = svg.clientWidth || 600;
    const unit = Math.min((W - 28) / 6.4, 52), ymin = -1.2, ymax = 7.5, top = 10;
    const H = top + (ymax - ymin) * unit + 24;
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.style.height = H + 'px';
    svg.replaceChildren();
    const cx = W / 2, X = x => cx + x * unit, Y = y => top + (ymax - y) * unit;
    const defs = node(svg, 'defs'), cp = node(defs, 'clipPath', { id: 's5-clip' });
    node(cp, 'rect', { x: X(-3.2), y: Y(ymax), width: 6.4 * unit, height: (ymax - ymin) * unit });
    for (let y = 0; y <= 7; y++) line(svg, X(-3.2), Y(y), X(3.2), Y(y), 'var(--line)', y === 0 ? 1.5 : 1);
    for (let x = -3; x <= 3; x++){
      line(svg, X(x), Y(ymax), X(x), Y(ymin), 'var(--line)', x === 0 ? 1.5 : 1, { opacity: x === 0 ? 1 : .5 });
      node(svg, 'text', { x: X(x), y: Y(0) + 16, 'text-anchor': 'middle', class: 'ax' }, x < 0 ? MINUS + Math.abs(x) : String(x));
    }
    [2, 4, 6].forEach(y => node(svg, 'text', { x: X(-3.2) + 4, y: Y(y) - 4, class: 'ax' }, String(y)));
    const g = node(svg, 'g', { 'clip-path': 'url(#s5-clip)' });
    const pts = [];
    for (let i = 0; i <= 160; i++){ const x = -3.2 + 6.4 * i / 160; pts.push([X(x), Y(x * x)]); }
    path(g, pts, 'var(--teal)', 3);
    TANG.forEach(q => {
      const u = ease(prog(t, q.s, q.e)); if (u <= 0) return;
      const m = 2 * q.x0, col = m < 0 ? 'var(--down)' : (m > 0 ? 'var(--up)' : 'var(--flat)'), hl = 1.3 * u, y0 = q.x0 * q.x0;
      line(g, X(q.x0 - hl), Y(y0 - m * hl), X(q.x0 + hl), Y(y0 + m * hl), col, 3.2, { 'stroke-linecap': 'round', class: 's5-tan', 'data-x0': q.x0 });
      node(svg, 'circle', { cx: X(q.x0), cy: Y(y0), r: 5, fill: 'var(--bg)', stroke: col, 'stroke-width': 2.6 });
    });
    if (t >= TOTAL){       // nhãn hệ số góc chỉ hiện khi hình đã dừng hẳn
      TANG.forEach(q => {
        const m = 2 * q.x0, y0 = q.x0 * q.x0, col = m < 0 ? 'var(--down)' : (m > 0 ? 'var(--up)' : 'var(--flat)');
        const lx = q.x0 < 0 ? X(q.x0) - 12 : (q.x0 > 0 ? X(q.x0) + 12 : X(0)), ly = q.x0 === 0 ? Y(0) - 12 : Y(y0) - 4, an = q.x0 < 0 ? 'end' : (q.x0 > 0 ? 'start' : 'middle');
        node(svg, 'text', { x: lx, y: ly, 'text-anchor': an, style: 'font-weight:700;font-size:15px;fill:' + col, class: 's5-lab' }, fill(T.s5_p_lab, { m: fmt(m, 0) }));
      });
    }
    syncButtons();
  }

  function bring(sel, block){
    const el = $(sel);
    try { el.scrollIntoView({ block: block || 'start', behavior: reduced() ? 'auto' : 'smooth' }); } catch (e) {}
  }
  function syncButtons(){
    if (!root || !clock) return;
    const done = clock.t >= clock.total, rm = reduced();
    $('#s5-pp').hidden = done || rm;
    $('#s5-pp').textContent = clock.playing ? T.s3_b_pause : T.s3_b_resume;
    $('#s5-skip').hidden = done;
    $('#s5-skip').textContent = rm ? T.s3_b_step : T.s3_b_skip;
    $('#s5-skip').classList.toggle('pulsebtn', rm && !done);
    $('#s5-rep').hidden = !done;
  }
  function startRun(isReplay){
    clock.stop(); clock.setTotal(TOTAL);
    $('#s5-fig').hidden = false; $('#s5-go').hidden = true; $('#s5-read').hidden = true;
    log(isReplay ? 's5_replay' : 's5_start');
    clock.seek(0);
    if (!reduced()) clock.play();
    syncButtons();
    bring('#s5-fig');
  }
  /* ✔ KẾT THÚC MOTION: hiện câu kết luận hệ số góc −4, 0, 4 và câu nối sang màn 6 */
  function finishRun(){
    if (!st.ranB){ st.ranB = true; render(true); bring('#s5-concl', 'center'); }
    syncButtons();
  }

  /* ---------- 📋 các khối hiện dần theo từng nút (stage 1: bảng · 2: rút gọn · 3: x₀ bất kỳ). animationDelay = (i × 0.35) giây giữa các dòng ---------- */
  function tableHTML(){
    return HS.map(h => {
      const up = Math.pow(3 + h, 2) - 9;
      return '<tr><td>' + fmt(h, 2) + '</td><td>' + fmt(up, 4) + '</td><td class="v">' + fmt(up / h, 4) + '</td></tr>';
    }).join('');
  }
  function render(flash){
    const s = st.stage;
    $('#s5-tb tbody').innerHTML = tableHTML();
    showBlock($('#s5-c1'), s >= 1);
    $('#s5-b1').hidden = s >= 1;
    showBlock($('#s5-c2'), s >= 2);
    $('#s5-b2').hidden = s >= 2;
    ['#s5-a0', '#s5-a1', '#s5-a2', '#s5-a3', '#s5-a4', '#s5-a5', '#s5-key'].forEach((id, i) => { const e = $(id); const was = e.hidden; e.hidden = s < 2; if (was && !e.hidden){ e.classList.add('fade'); e.style.animationDelay = (i * 0.35) + 's'; } });
    showBlock($('#s5-c3'), s >= 3);
    $('#s5-b3').hidden = s >= 3;
    ['#s5-g1', '#s5-g2', '#s5-gnote'].forEach((id, i) => { const e = $(id); const was = e.hidden; e.hidden = s < 3; if (was && !e.hidden){ e.classList.add('fade'); e.style.animationDelay = (i * 0.35) + 's'; } });
    showBlock($('#s5-pb'), s >= 3);
    showBlock($('#s5-after'), st.ranB);
  }
  function next(sel){
    st.stage++; log('s5_stage', { n: st.stage });
    render(true);
    try { $(sel).scrollIntoView({ block: 'center', behavior: reduced() ? 'auto' : 'smooth' }); } catch (e) {}
  }

  function mount(r){
    root = r;
    const th = T.s5_th.split('|');
    // phân số lim (h → 0) của công thức, giống màn 4 (dùng chung CSS .limwrap / .lim)
    const limHTML = '<span class="limwrap"><span class="lim"><span>lim</span><small>h → 0</small></span>' + frac('f(x₀ + h) ' + MINUS + ' f(x₀)', 'h') + '</span>';
    root.innerHTML =
      '<div class="kick">' + kick(5) + '</div>' +
      '<h1 class="title">' + T.s5_title + '</h1>' +
      // KHỐI CÔNG THỨC BAN ĐẦU: hiện ngay khi vào màn, trước mọi nút / phép tính (chữ: T.s5_f_lead, T.s5_f_def)
      '<p class="t2" style="margin-bottom:0">' + T.s5_f_lead + '</p>' +
      '<div class="defbox">' + fill(T.s5_f_def, { lim: limHTML }) + '</div>' +
      '<p class="lead" style="font-size:17px;margin-top:14px">' + T.s5_t1 + '</p>' +
      '<div class="row"><button type="button" class="btn primary pulsebtn" id="s5-b1" style="flex:none">' + T.s5_b1 + '</button></div>' +
      '<div id="s5-c1" hidden>' +
        '<div class="card"><table class="tb" id="s5-tb"><thead><tr><th>' + th[0] + '</th><th>' + th[1] + '</th><th>' + th[2] + '</th></tr></thead><tbody></tbody></table></div>' +
        '<p class="t2">' + T.s5_obs + '</p>' +
        '<div class="row"><button type="button" class="btn primary pulsebtn" id="s5-b2" style="flex:none">' + T.s5_b2 + '</button></div>' +
      '</div>' +
      '<div class="card" id="s5-c2" hidden><h3>' + T.s5_a_title + '</h3>' +
        '<p class="fl" id="s5-a0" hidden>' + T.s5_a0 + '</p><p class="fl" id="s5-a1" hidden>' + T.s5_a1 + '</p><p class="fl" id="s5-a2" hidden>' + T.s5_a2 + '</p>' +
        '<p class="fl" id="s5-a3" hidden>' + T.s5_a3.replace('h(6 + h) ÷ h', '<span class="cx">h</span>(6 + h) ÷ <span class="cx">h</span>') + '</p>' +
        '<p class="fl" id="s5-a4" hidden><b>' + T.s5_a4 + '</b></p><p class="fl" id="s5-a5" hidden>' + T.s5_a5 + '</p>' +
        '<div class="conclusion" id="s5-key" hidden>' + T.s5_key + '</div>' +
        '<div class="row"><button type="button" class="btn sm accent pulsebtn" id="s5-b3">' + T.s5_b3 + '</button></div>' +
      '</div>' +
      '<div class="card" id="s5-c3" hidden><h3>' + T.s5_g_title + '</h3>' +
        '<p class="fl" id="s5-g1" hidden>' + T.s5_g1 + '</p><p class="fl" id="s5-g2" hidden>' + T.s5_g2 + '</p>' +
        '<p class="note" id="s5-gnote" hidden style="margin:0">' + T.s5_gnote + '</p>' +
      '</div>' +
      '<div id="s5-pb" hidden><p class="t2">' + T.s5_t2 + '</p><p class="readhint" id="s5-read">' + T.s4_read + '</p>' +
        '<div class="row"><button type="button" class="btn primary pulsebtn" id="s5-go" style="flex:none">' + T.s4_go + '</button></div></div>' +
      '<div id="s5-fig" hidden style="margin-top:6px">' +
        '<div class="row stk" style="margin-top:0"><button type="button" class="btn sm" id="s5-pp">' + T.s3_b_pause + '</button><button type="button" class="btn sm" id="s5-skip">' + T.s3_b_skip + '</button><button type="button" class="btn sm" id="s5-rep" hidden>' + T.s3_b_replay + '</button></div>' +
        '<div class="frame"><svg id="s5-svg" class="cv" role="img" aria-label="Đồ thị y = x². Ba tiếp tuyến lần lượt hiện tại x₀ = −2, 0 và 2."></svg></div>' +
      '</div>' +
      '<div id="s5-after" hidden>' +
        '<div class="conclusion" id="s5-concl" style="scroll-margin-top:124px">' + T.s5_p_concl + '</div>' +
        '<p class="bridge">' + T.s5_bridge + '</p>' +
      '</div>';
    svg = $('#s5-svg');
    clock = makeClock(paint, finishRun);
    $('#s5-b1').addEventListener('click', () => next('#s5-c1'));
    $('#s5-b2').addEventListener('click', () => next('#s5-c2'));
    $('#s5-b3').addEventListener('click', () => next('#s5-c3'));
    $('#s5-go').addEventListener('click', () => startRun(false));
    $('#s5-pp').addEventListener('click', () => { if (clock.playing){ clock.pause(); log('s5_pause'); } else clock.play(); syncButtons(); });
    $('#s5-skip').addEventListener('click', () => {
      const nb = BOUNDS.find(v => v > clock.t + 1), was = clock.playing;
      clock.pause(); clock.seek(nb === undefined ? TOTAL : nb);
      if (clock.t >= TOTAL) finishRun(); else if (was) clock.play();
      syncButtons();
    });
    $('#s5-rep').addEventListener('click', () => startRun(true));
    render(false);
    if (st.ranB){
      $('#s5-fig').hidden = false; $('#s5-go').hidden = true; $('#s5-read').hidden = true;
      clock.setTotal(TOTAL); clock.seek(TOTAL);
    }
    syncButtons();
  }
  return {
    tab: T.tab5, hasNext: true,
    mount: mount,
    unmount(){ if (clock) clock.stop(); svg = null; },
    redraw(){ if (svg && clock && !$('#s5-fig').hidden) paint(clock.t); },
    dbg: { seek: t => { clock.pause(); clock.seek(t); syncButtons(); }, TOTAL: TOTAL, TANG: TANG, get clock(){ return clock; } }
  };
}
/* ============================================================
   MÀN 6 — Chốt kiến thức: bốn câu trắc nghiệm tự chấm (đáp án nhiễu là các hiểu lầm điển hình), rồi bảng "Điều cần nhớ".
   Chọn sai thì chọn lại; câu đúng thì khóa. Bảng tóm tắt hiện khi cả bốn câu đã đúng.
   ============================================================ */
function createS6(){
  const st = state.s6;                                   // { ok[4], tries[4], pick[4] }
  let root;
  const $ = s => root.querySelector(s);
  const ANS = () => T.s6_ans.split('|').map(Number);
  const Q = i => ({ q: T['s6_q' + i], o: T['s6_q' + i + 'o'].split('|'), f: T['s6_q' + i + 'f'].split('|') });

  function renderQ(i){
    const el = $('#s6-q' + (i + 1)), d = Q(i + 1), a = ANS()[i];
    el.querySelectorAll('.opt').forEach((b, k) => {
      b.disabled = st.ok[i];
      if (st.ok[i] && k === a) b.dataset.s = 'ok';
      else if (!st.ok[i] && b.dataset.bad === '1') b.dataset.s = 'bad';
      else if (b.dataset.s !== 'ok') delete b.dataset.s;
    });
    const f = el.querySelector('.qf');
    if (st.pick[i] >= 0){
      f.textContent = d.f[st.pick[i]];
      f.className = 'qf ' + (st.pick[i] === a ? 'ok' : 'bad');
    }
  }
  function renderSum(){
    showBlock($('#s6-sum'), st.ok.every(Boolean));
  }
  function choose(i, k){
    const a = ANS()[i];
    if (st.ok[i]) return;
    st.tries[i]++; st.pick[i] = k;
    const ok = k === a;
    log('s6_answer', { q: i + 1, ok: ok });
    const b = $('#s6-q' + (i + 1)).querySelectorAll('.opt')[k];
    if (ok) st.ok[i] = true; else b.dataset.bad = '1';
    renderQ(i); renderSum();
    if (st.ok.every(Boolean)){ try { $('#s6-sum').scrollIntoView({ block: 'center', behavior: reduced() ? 'auto' : 'smooth' }); } catch (e) {} }
  }
  function mount(r){
    root = r;
    let html = '<div class="kick">' + kick(6) + '</div><h1 class="title">' + T.s6_title + '</h1><p class="lead" style="font-size:17px">' + T.s6_lead + '</p>';
    for (let i = 1; i <= 4; i++){
      const d = Q(i);
      html += '<div class="q" id="s6-q' + i + '"><p class="qt">' + i + '. ' + d.q + '</p>' +
        d.o.map((o, k) => '<button type="button" class="opt" data-k="' + k + '">' + o + '</button>').join('') +
        '<p class="qf" aria-live="polite"></p></div>';
    }
    html += '<div id="s6-sum" hidden><div class="conclusion"><b style="color:var(--teal)">' + T.s6_sum_title + '</b>' +
      '<p style="margin:8px 0 6px">' + T.s6_sum1 + '</p><p style="margin:0 0 6px">' + T.s6_sum2 + '</p><p style="margin:0">' + T.s6_sum3 + '</p></div></div>';
    root.innerHTML = html;
    for (let i = 0; i < 4; i++){
      const btns = $('#s6-q' + (i + 1)).querySelectorAll('.opt');
      btns.forEach((b, k) => b.addEventListener('click', () => choose(i, k)));
      // khôi phục khi quay lại màn
      if (st.pick[i] >= 0){
        if (st.ok[i]) btns[ANS()[i]].dataset.s = 'ok';
        else btns[st.pick[i]].dataset.bad = '1';
        renderQ(i);
      }
    }
    renderSum();
  }
  return {
    tab: T.tab6, hasNext: false,
    mount: mount,
    unmount(){},
    redraw(){}
  };
}

/* ============================================================
   Khung điều hướng: mảng screens[] — thêm màn 4, 5 chỉ cần thêm phần tử
   ============================================================ */
const screens = [createS1(), createS2(), createS3(), createS4(), createS5(), createS6()];
const main = document.getElementById('app');
const nav = document.getElementById('nav');
const btnBack = document.getElementById('back'), btnNext = document.getElementById('next');

screens.forEach((s, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'tab'; b.setAttribute('aria-label', s.tab);
  const parts = s.tab.split(' · ');
  b.innerHTML = '<span class="tn">' + parts[0] + '</span><span class="tl"> · ' + (parts[1] || '') + '</span>';
  b.addEventListener('click', () => go(i));
  nav.appendChild(b);
});
function go(i){
  if (i < 0 || i >= screens.length) return;
  if (state.screen >= 0) screens[state.screen].unmount();
  state.screen = i;
  main.replaceChildren();
  screens[i].mount(main);
  Array.from(nav.children).forEach((b, k) => { if (k === i) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current'); });
  btnBack.disabled = i === 0;
  btnNext.hidden = !screens[i].hasNext || i === screens.length - 1;
  window.scrollTo(0, 0);
  log('screen_enter', { screen: i + 1 });
}
btnBack.addEventListener('click', () => go(state.screen - 1));
btnNext.addEventListener('click', () => go(state.screen + 1));
let lastW = 0;
new ResizeObserver(entries => {
  const w = Math.round(entries[0].contentRect.width);
  if (w === lastW) return;
  lastW = w;
  if (state.screen >= 0) screens[state.screen].redraw();
}).observe(main);

window.__app = { state: state, screens: screens, go: go };
go(0);
})();
</script>
